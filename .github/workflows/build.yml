name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev zip unzip
          pip install --upgrade pip
          pip install cython
          pip install git+https://github.com/kivy/buildozer.git
      - name: Clear lxml build cache
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a/build/other_builds/lxml || true
      - name: Build APK
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt ===" | tee -a build.log
            if yes | buildozer android debug 2>&1 | tee -a build.log; then
              echo "Build succeeded on attempt $attempt" | tee -a build.log
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Build failed after 3 attempts" | tee -a build.log
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 15s..." | tee -a build.log
            sleep 15
          done
          if ! ls bin/*.apk >/dev/null 2>&1; then
            echo "No APK found in bin/ despite exit 0 — failing the job." | tee -a build.log
            exit 1
          fi
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/
          if-no-files-found: warn
